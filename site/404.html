<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Não Encontrada — DoubleDyn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/logo-icon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; position: relative; overflow: hidden;
        }
        .error-page::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 40%, rgba(195,255,0,0.06) 0%, transparent 60%);
            filter: blur(60px);
        }
        .error-content { position: relative; z-index: 1; max-width: 600px; }
        .error-code {
            font-family: var(--font-mono); font-size: clamp(6rem, 15vw, 10rem);
            font-weight: 700; color: var(--accent); opacity: 0.15; line-height: 1;
            margin-bottom: -20px;
        }
        .error-title {
            font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700; margin-bottom: 16px;
        }
        .error-desc { color: var(--text-dim); font-size: 1.1rem; margin-bottom: 40px; line-height: 1.7; }
        .error-ctas { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .error-leaf { font-size: 4rem; margin-bottom: 16px; display: block; }
    </style>
</head>
<body>
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/logo-icon.png" alt="DoubleDyn" class="logo-img">
                <span class="logo-text">DoubleDyn</span>
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html#calculadora">Calculadora</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="index.html#contato" class="nav-cta">Fale Conosco</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <main>
    <div class="error-page">
        <div class="error-content">
            <span class="error-leaf">🌿</span>
            <div class="error-code">404</div>
            <h1 class="error-title">Página não encontrada</h1>
            <p class="error-desc">Parece que esta página se perdeu no caminho. Mas você pode voltar para calcular o impacto ambiental da sua empresa ou explorar nosso blog.</p>
            <div class="error-ctas">
                <a href="index.html" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M9 21V9h6v12"/></svg>
                    Voltar ao Início
                </a>
                <a href="index.html#calculadora" class="btn btn-secondary">Calculadora →</a>
            </div>
        </div>
    </div>
    </main>

    <script>
    document.getElementById('navToggle').addEventListener('click', function() {
        document.getElementById('navLinks').classList.toggle('open');
        this.classList.toggle('active');
    });
    </script>
</body>
</html>
